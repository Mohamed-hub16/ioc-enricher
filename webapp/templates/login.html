{% extends "base.html" %}
{% block title %}Connexion — IOC Enricher{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4 col-sm-8">
    <div class="card">
      <div class="card-body p-4">
        <h4 class="card-title text-center mb-4">
          <i class="bi bi-shield-lock text-info me-2"></i>Connexion
        </h4>
        <form method="post">
          <div class="mb-3">
            <label class="form-label small text-muted">Email</label>
            <input type="email" name="email" class="form-control" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label small text-muted">Mot de passe</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-info">Se connecter</button>
          </div>
        </form>
        <hr class="my-3">
        <p class="text-center text-muted small mb-0">
          Pas encore de compte ?
          <a href="{{ url_for('auth.register') }}" class="text-info">S'inscrire</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
