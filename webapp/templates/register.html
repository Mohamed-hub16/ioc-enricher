{% extends "base.html" %}
{% block title %}Inscription — IOC Enricher{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4 col-sm-8">
    <div class="card">
      <div class="card-body p-4">
        <h4 class="card-title text-center mb-1">
          <i class="bi bi-person-plus text-info me-2"></i>Inscription
        </h4>
        <p class="text-center text-muted small mb-4">
          Un administrateur devra approuver votre compte avant que vous puissiez enrichir des IOCs.
        </p>
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label small text-muted">Email</label>
            <input type="email" name="email" class="form-control" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label small text-muted">
              Mot de passe
              <span class="text-muted">(12 car. min, 1 majuscule, 1 chiffre, 1 spécial)</span>
            </label>
            <input type="password" name="password" class="form-control" required minlength="12">
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-info">Créer mon compte</button>
          </div>
        </form>
        <hr class="my-3">
        <p class="text-center text-muted small mb-0">
          Déjà inscrit ?
          <a href="{{ url_for('auth.login') }}" class="text-info">Se connecter</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
